name: Dafny

on:
  push:
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dafny
        uses: dafny-lang/setup-dafny-action@v1

      - name: Verify and compile Dafny
        run: dafny build src/Bison.Razor/Verified/Filter.dfy --target:cs --include-runtime --allow-external-contracts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test test/Bison.Razor.Tests
        