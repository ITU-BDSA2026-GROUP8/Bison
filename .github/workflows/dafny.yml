name: Dafny

on:
  push:
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Dafny proof
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            ghcr.io/dafny-lang/dafny:4.10.0 \
            verify --allow-external-contracts src/Bison.Razor/Verified/Filter.dfy

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test test/Bison.Razor.Tests