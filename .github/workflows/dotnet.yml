# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Install Playwright browsers
      run: pwsh test/PlaywrightTests/bin/Debug/net8.0/playwright.ps1 install --with-deps chromium
    - name: Test
      run: |
              export Authentication__GitHub__ClientId="${{ secrets.GITHUBCLIENTID }}"
              export Authentication__GitHub__ClientSecret="${{ secrets.GITHUBCLIENTSECRET }}"
              dotnet test --no-build --verbosity normal
