name: Release Bison Executable

on:
  push:
    tags:
      - "v*"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      # ---- Publish single-file executables ----

      - name: Publish Linux x64
        run: |
         dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r linux-x64 --self-contained false -p:PublishSingleFile=true -o publish/linux-x64

      - name: Publish Windows x64
        run: |
         dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish/win-x64

      - name: Publish macOS x64
        run: |
         dotnet publish Bison.CLI/Bison.CLI.csproj -c Release -r osx-x64 --self-contained false -p:PublishSingleFile=true -o publish/osx-x64

- name: Zip artifacts
       run: |
         cd publish/linux-x64 && zip -r ../../bison-linux-x64.zip . && cd ../..
         cd publish/win-x64 && zip -r ../../bison-win-x64.zip . && cd ../..
         cd publish/osx-x64 && zip -r ../../bison-osx-x64.zip . && cd ../..


      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            bison-linux-x64.zip
           bison-win-x64.zip
           bison-osx-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}